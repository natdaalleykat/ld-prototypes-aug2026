<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agent jobs on SDK setup · prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1D1F24; --ink2:#3D4148; --muted:#646A73;
  --line:#E3E6EB; --line2:#EEF0F3; --bg:#F7F8FA; --card:#fff;
  --blue:#405BFF; --blue-d:#2F45D6; --blue-50:#F2F4FF;
  --green:#0B7D4F; --green-50:#EAF7F0;
  --red:#C4332B; --red-50:#FDEEEC;
  --violet:#6B3FC4; --violet-50:#F3EDFD;
  --amber:#9A5B00; --amber-50:#FFF4DC;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--card);color:var(--ink);font:14px/1.5 var(--sans);padding-bottom:96px}
button{font:inherit;color:inherit;cursor:pointer}
svg{display:block}

/* product chrome */
.top{border-bottom:1px solid var(--line);background:#fff}
.top .in{max-width:1000px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:8px}
.top .sp{flex:1}
.ghost{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;font-weight:600;font-size:13px}
.ghost:hover{background:var(--bg)}
.ghost svg{width:15px;height:15px;stroke:var(--ink2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.page{max-width:1000px;margin:0 auto;padding:44px 24px 0}
.head{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.head .txt{flex:1 1 480px;min-width:0}
h1{font-size:30px;line-height:1.15;letter-spacing:-.02em;font-weight:700;margin:0 0 8px;text-wrap:balance}
.sub{font-size:16px;color:var(--ink2);margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--bg);flex:none;margin-top:4px}
.seg button{border:0;background:transparent;border-radius:6px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,24,34,.12)}

/* job cards (option A) */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
.job{text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;gap:14px;align-items:flex-start;transition:border-color .12s,box-shadow .12s,transform .12s}
.job:hover{border-color:#B9C0CC;box-shadow:0 4px 16px rgba(20,24,34,.07);transform:translateY(-1px)}
.job:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.job[aria-pressed=true]{border-color:var(--blue);background:var(--blue-50);box-shadow:0 0 0 1px var(--blue)}
.ico{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none}
.ico svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.k-kill .ico{background:var(--red-50);color:var(--red)}
.k-dark .ico{background:var(--blue-50);color:var(--blue-d)}
.k-flags .ico{background:var(--violet-50);color:var(--violet)}
.k-basic .ico{background:var(--amber-50);color:var(--amber)}
.job[aria-pressed=true] .ico{background:#fff}
.b{min-width:0;flex:1;display:block}
.jt{display:block;font-size:16px;line-height:1.3;font-weight:650;letter-spacing:-.005em}
.jd{display:block;color:var(--ink2);font-size:14px;margin-top:3px}
.finds{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;align-items:center}
.finds .l{font-size:12.5px;font-weight:600;color:var(--muted);margin-right:3px}
.row .finds{margin-top:9px}
.row.open .chip{background:#fff}
.row .jd{max-width:74ch}
.chip{font:500 12px/1 var(--mono);background:var(--bg);border:1px solid var(--line2);color:var(--ink2);border-radius:5px;padding:4px 6px;white-space:nowrap}
.job[aria-pressed=true] .chip{background:#fff}
.jshort{display:none}
/* after a pick: cards compact into a row so the prompt sits right under them */
.grid.picked{grid-template-columns:repeat(4,1fr);gap:8px}
.grid.picked .job{padding:10px 12px;gap:10px;align-items:center;border-radius:10px}
.grid.picked .job:hover{transform:none;box-shadow:none}
.grid.picked .ico{width:28px;height:28px;border-radius:7px}
.grid.picked .ico svg{width:15px;height:15px}
.grid.picked .jt,.grid.picked .jd,.grid.picked .finds{display:none}
.grid.picked .jshort{display:block;font-size:13.5px;font-weight:600;line-height:1.25}

.foot{margin:14px 2px 0;font-size:13px;color:var(--muted);display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center}
.foot .trust{display:inline-flex;gap:6px;align-items:center}
.foot .trust svg{width:14px;height:14px;stroke:var(--green);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.foot .sp{flex:1}
.foot button{border:0;background:none;padding:0;color:var(--blue-d);font-weight:600}
.foot button:hover{text-decoration:underline}

/* prompt panel */
.panel{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.job{transition:none}}
.ph{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph .t{flex:1 1 260px;min-width:0;font-size:15px;font-weight:650}
.ph .t span{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.primary{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--blue);color:#fff;border-radius:7px;padding:9px 14px;font-weight:600;font-size:14px;flex:none}
.primary:hover{background:var(--blue-d)}
.primary svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.primary.done{background:var(--green)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.col{padding:16px 18px;min-width:0}
.col+.col{border-left:1px solid var(--line)}
.lab{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 8px}
.report{font:400 12.5px/1.55 var(--mono);overflow-wrap:anywhere;color:var(--ink)}
.r-i{color:var(--muted);margin-bottom:8px}
.r-row{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line2)}
.r-n{flex:none;color:var(--blue-d);font-weight:500}
.r-t{color:var(--blue-d);font-weight:500}
.r-p{color:var(--muted);font-size:12px}
.r-w{font-family:var(--sans);font-size:13px;color:var(--ink2);margin-top:2px}
.r-q{border-top:1px solid var(--line2);padding-top:10px;margin-top:2px;font-weight:500}
.prompt{border:1px solid var(--line2);border-radius:8px;background:var(--bg);overflow:hidden}
.prompt pre{margin:0;font:400 12.5px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);padding:12px 14px;max-height:212px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent)}
.prompt.open pre{max-height:none;-webkit-mask-image:none;mask-image:none}
.pf{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line2);background:#fff;font-size:12.5px;color:var(--muted)}
.pf .sp{flex:1}
.pf .k{display:inline-flex;gap:5px;align-items:center}
.pf svg{width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.link{border:0;background:none;padding:0;color:var(--blue-d);font-weight:600;font-size:12.5px}
.link:hover{text-decoration:underline}

/* after copy */
.watch{border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.watch .msg{flex:1 1 320px;font-size:13.5px;color:var(--ink2);min-width:0}
.watch .msg b{color:var(--ink);font-weight:600}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--blue);flex:none;box-shadow:0 0 0 0 rgba(64,91,255,.5);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(64,91,255,0)}100%{box-shadow:0 0 0 0 rgba(64,91,255,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.steps{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.steps span{display:inline-flex;gap:6px;align-items:center}
.dot{width:15px;height:15px;border-radius:50%;border:1.5px solid #B9C0CC;display:grid;place-items:center;flex:none}
.steps .ok{color:var(--ink)}
.steps .ok .dot{background:var(--green);border-color:var(--green)}
.dot svg{width:9px;height:9px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ok .dot svg{opacity:1}
.payoff{border-top:1px solid var(--line);background:var(--green-50);padding:16px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.payoff .msg{flex:1 1 320px;min-width:0}
.payoff .msg b{display:block;font-size:15px;font-weight:650;margin-bottom:2px}
.payoff .msg span{font-size:13.5px;color:var(--ink2)}
.payoff code,.watch code{font:500 12.5px var(--mono);border-radius:4px;padding:1px 5px}
.payoff code{background:rgba(255,255,255,.7);border:1px solid rgba(11,125,79,.2)}
.watch code{background:var(--bg);border:1px solid var(--line)}

/* option B list */
.list{margin-top:28px;display:grid;gap:8px}
.row{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.row>button{width:100%;text-align:left;border:0;background:#fff;padding:14px 18px;display:flex;gap:14px;align-items:center}
.row>button:hover{background:var(--bg)}
.row>button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.row.open{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.row.open>button{background:var(--blue-50)}
.row.open .ico{background:#fff}
.go{flex:none;font-size:13px;font-weight:600;color:var(--blue-d);display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.go svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.row.open .go svg{transform:rotate(90deg)}
.row .panel{margin:0;border:0;border-top:1px solid var(--line);border-radius:0;animation:none}

.manual{border:1px dashed var(--line);border-radius:12px;padding:28px;color:var(--muted);text-align:center;margin-top:28px}

/* prototype bar + notes */
.bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#16181D;color:#E9EBEF;border-radius:12px;padding:6px;display:flex;gap:4px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.28);max-width:calc(100vw - 24px);overflow-x:auto;z-index:20;font-size:13px}
.bar .tag{padding:0 10px 0 8px;color:#9AA1AC;white-space:nowrap;font-weight:500}
.bar button{border:0;background:transparent;color:#C9CED6;border-radius:8px;padding:7px 11px;font-weight:600;white-space:nowrap}
.bar button:hover{background:#262A31;color:#fff}
.bar button[aria-pressed=true]{background:#fff;color:#16181D}
.bar .sepv{width:1px;height:18px;background:#343943;margin:0 4px;flex:none}
.notes{position:fixed;right:16px;bottom:74px;width:min(420px,calc(100vw - 32px));max-height:min(70vh,600px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(20,24,34,.22);padding:20px 22px;z-index:19;display:none}
.notes.on{display:block}
.notes h2{font-size:16px;margin:0 0 10px}
.notes h4{font-size:12px;color:var(--muted);margin:16px 0 6px}
.notes ul{margin:0;padding-left:18px}
.notes li{margin:5px 0;color:var(--ink2);font-size:13.5px}
.notes li b{color:var(--ink)}

@media (max-width:820px){
  h1{font-size:24px}
  .grid,.grid.picked{grid-template-columns:1fr 1fr}
  .cols{grid-template-columns:1fr}
  .col+.col{border-left:0;border-top:1px solid var(--line)}
  .top .hide-s{display:none}
  .bar .tag{display:none}
  .page{padding:28px 16px 0}
  .go span{display:none}
}
@media (max-width:560px){ .grid{grid-template-columns:1fr} }
</style>
</head>
<body>

<header class="top"><div class="in">
  <svg width="30" height="30" viewBox="0 0 32 32" aria-label="Product mark placeholder"><path d="M4 16h20M17 8l8 8-8 8M10 10l6 6-6 6" fill="none" stroke="#1D1F24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span class="sp"></span>
  <button class="ghost hide-s"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.500 9.500a2.500 2.500 0 1 1 3.500 2.300c-.700.400-1 1-1 1.700M12 17h.010"/></svg>Get support</button>
  <button class="ghost hide-s"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 8V5h8v3M3 13h18"/></svg>Explore sandbox</button>
  <button class="ghost"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>Close setup</button>
</div></header>

<main class="page">
  <div class="head">
    <div class="txt">
      <h1>Start with something real in your own code</h1>
      <p class="sub">Pick one. Your coding agent finds the spot in your repo and sets it up.</p>
    </div>
    <div class="seg" role="group" aria-label="Setup method">
      <button id="m-ai" aria-pressed="true">With your coding agent</button>
      <button id="m-manual" aria-pressed="false">Install manually</button>
    </div>
  </div>
  <div id="ai"><div id="stage"></div></div>
  <div id="manual" class="manual" hidden>Manual install is unchanged from today: pick your SDK and follow the snippets.<br>It is out of scope for this prototype.</div>
</main>

<div class="notes" id="notes" role="dialog" aria-label="Why this design"></div>

<nav class="bar" aria-label="Prototype controls">
  <span class="tag">Prototype · potential direction</span>
  <button id="v-a" aria-pressed="true">A · Cards</button>
  <button id="v-b" aria-pressed="false">B · List</button>
  <span class="sepv"></span>
  <button id="demo">Demo: next state</button>
  <button id="why" aria-pressed="false">Why</button>
</nav>

<script src="prompts.js?v=6"></script>
<script>
const I = {
  kill:'<svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.300 7.300a8 8 0 1 0 11.400 0"/></svg>',
  dark:'<svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.500"/><circle cx="6" cy="18" r="2.500"/><circle cx="18" cy="8" r="2.500"/><path d="M6 8.500v7M18 10.500c0 4-6 3-6 7"/></svg>',
  flags:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="6" rx="3"/><circle cx="17.500" cy="8" r="1.300"/><rect x="3" y="14" width="18" height="6" rx="3"/><circle cx="6.500" cy="17" r="1.300"/></svg>',
  bolt:'<svg viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>',
  lock:'<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  shield:'<svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.500-3 8.300-7 10-4-1.700-7-5.500-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  arrow:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>'
};

function rep(intro, items, ask, bullets){
  return `<div class="r-i">${intro}</div>` + items.map((it,i)=>`
    <div class="r-row"><span class="r-n">${bullets?"·":i+1}</span><div><div class="r-t">${it[0]}</div><div class="r-p">${it[1]}</div><div class="r-w">${it[2]}</div></div></div>`).join('') +
    `<div class="r-q">${ask}</div>`;
}

const JOBS = [
 { id:'kill', cls:'k-kill', icon:I.kill, short:'Kill switch',
   title:'Put a kill switch on your riskiest code path',
   desc:'Your agent finds the code most likely to cause an incident, like a payment or third-party call, and wraps it in a switch you can flip off in seconds.',
   look:'Looks for', chips:['payments','third-party APIs','recent changes'],
   flag:'kill-switch-stripe-checkout',
   payoffT:'Now try the part that matters',
   payoff:'Flip <code>kill-switch-stripe-checkout</code> here and checkout pauses with a friendly message. No deploy.',
   report:rep('No LaunchDarkly here yet. 3 risky code paths, ranked by what breaks:',[
     ['Stripe Checkout','src/app/api/checkout/route.ts:136','Your only revenue path. No timeout, so a slow Stripe leaves buyers on a spinner for 80 seconds.'],
     ['Resend email','src/lib/email.ts:25','Every email goes through this one function. It retries, but has no timeout and no off switch.'],
     ['Magic-link sign-in','src/lib/auth.ts:61','Poor candidate. With it off, nobody can log in.']],
     'Which one should I guard? My default is 1.') },
 { id:'dark', cls:'k-dark', icon:I.dark, short:'Merge dark',
   title:'Merge work in progress without releasing it',
   desc:'Your agent reads your current branch and puts the feature you are building behind a flag that stays off until you are ready.',
   look:'Looks for', chips:['current branch','uncommitted changes'],
   flag:'release-driver-eta-v2',
   payoffT:'Your branch is safe to merge',
   payoff:'<code>release-driver-eta-v2</code> is off for everyone. Turn it on for just yourself and see the new path.',
   report:rep("You're on feature/driver-eta-v2. 9 files changed vs main. The new behavior enters here:",[
     ['ETA calculation','src/eta/estimate.ts:40','New v2 path replaces the old estimate for every request.'],
     ['ETA card UI','web/components/EtaCard.tsx:12','Display only. Lower risk.'],
     ['Cache key format','src/eta/cache.ts:19','Changes with v2. Lower risk.']],
     "I'd wrap 1 so this branch can merge with v2 off. OK?") },
 { id:'flags', cls:'k-flags', icon:I.flags, short:'Existing flags',
   title:'Bring your existing flags under control',
   desc:'Your agent lists the env-var and config toggles already in your code, then moves the one you choose behind a LaunchDarkly flag.',
   look:'Looks for', chips:['ENABLE_*','features.yml','other flag SDKs'],
   flag:'sale-banner',
   payoffT:'One down, and a plan for the rest',
   payoff:'<code>sale-banner</code> now lives in LaunchDarkly. Turn it off here and the stale banner is gone.',
   report:rep('No env-var flags, but 3 things that turn product behavior on or off:',[
     ['Sale banner, always on','src/app/layout.tsx:39','Still advertising a sale that ended in May. Hiding it takes a deploy.'],
     ['Referral credits','src/app/api/checkout/route.ts:14','On whenever a coupon variable is set.'],
     ['Multi-seat discount','src/app/api/checkout/route.ts:13','Same pattern.']],
     'Move the sale banner first? You could turn it off today without a deploy.', true) },
 { id:'basic', cls:'k-basic', icon:I.bolt, short:'Test a flag',
   title:'Install the SDK and test a flag',
   desc:'The quick start. Your agent installs the SDK and gates one harmless line, so you can watch a flag change your app.',
   look:'Sets up', chips:['SDK install','one test flag'],
   flag:'test-flag',
   payoffT:'SDK connected',
   payoff:'<code>test-flag</code> was evaluated in Production. Turn it on here and watch the line change.',
   report:rep('Detected: Next.js on Vercel, server-side. No LaunchDarkly here yet.',[
     ['Install','@launchdarkly/node-server-sdk','One shared client in src/lib/launchdarkly.ts, initialized once.'],
     ['Gate one line','src/app/api/health/route.ts:8','A log line behind a boolean flag named test-flag.']],
     'Nothing else changes. OK to go? My default is yes.') }
];
JOBS.forEach(j=>{ j.prompt = PROMPTS[j.id]; });

const S = { variant:'a', job:null, open:false, copied:false, stage:0 };
const $ = (s)=>document.querySelector(s);
const jobById = (id)=> JOBS.find(j=>j.id===id);
const esc = (s)=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function panelHTML(j){
  const watch = !S.copied ? '' : (S.stage<2 ? `
    <div class="watch" role="status">
      <span class="pulse"></span>
      <div class="msg">${S.stage===0
        ? `<b>Your agent is working in your repo.</b> LaunchDarkly can't see that part. This updates when your flag is created.`
        : `<b>Flag created:</b> <code>${j.flag}</code>. Tell your agent it exists so it can run your code once.`}</div>
      <div class="steps">
        <span class="${S.stage>=1?'ok':''}"><span class="dot">${I.check}</span>Flag created</span>
        <span class="${S.stage>=2?'ok':''}"><span class="dot">${I.check}</span>First evaluation</span>
      </div>
    </div>` : `
    <div class="payoff" role="status">
      <div class="msg"><b>${j.payoffT}</b><span>${j.payoff}</span></div>
      <button class="primary">Open ${j.flag} →</button>
    </div>`);
  return `
  <section class="panel" aria-label="Prompt: ${j.title}">
    <div class="ph">
      <div class="t">Paste this into your coding agent<span>It shows you what it found before it changes anything.</span></div>
      <button class="primary ${S.copied?'done':''}" data-act="copy">${S.copied?I.check+'Copied':I.copy+'Copy prompt'}</button>
    </div>
    <div class="cols">
      <div class="col">
        <p class="lab">What comes back first (from a real test run)</p>
        <div class="report">${j.report}</div>
      </div>
      <div class="col">
        <p class="lab">The prompt</p>
        <div class="prompt ${S.open?'open':''}">
          <pre>${esc(j.prompt(true)).replace(/sdk-EXAMPLE[-0-9]+/,'sdk-••••••••••••••••').replace(/mob-EXAMPLE[-0-9]+/,'mob-••••••••••••••••')}</pre>
          <div class="pf">
            <button class="link" data-act="toggle">${S.open?'Show less':'Show full prompt'}</button>
            <span class="sp"></span>
            <span class="k">${I.lock}Keys are added on copy</span>
            <button class="link" data-act="copy-nokeys">Copy without keys</button>
          </div>
        </div>
      </div>
    </div>
    ${watch}
  </section>`;
}

const FOOT = `
  <p class="foot">
    <span class="trust">${I.shield}Runs in your own agent. LaunchDarkly never sees your repo.</span>
    <span class="trust">${I.check}Nothing to install first</span>
  </p>`;

function render(){
  const st = $('#stage');
  if(S.variant==='a'){
    st.innerHTML = `
      <div class="grid ${S.job?'picked':''}">${JOBS.map(j=>`
        <button class="job ${j.cls}" data-job="${j.id}" aria-pressed="${S.job===j.id}" aria-label="${j.title}">
          <span class="ico">${j.icon}</span>
          <span class="b">
            <span class="jt">${j.title}</span>
            <span class="jd">${j.desc}</span>
            <span class="finds"><span class="l">${j.look}</span>${j.chips.map(c=>`<span class="chip">${c}</span>`).join('')}</span>
            <span class="jshort">${j.short}</span>
          </span>
        </button>`).join('')}
      </div>
      ${S.job?panelHTML(jobById(S.job)):''}
      ${FOOT}`;
  } else {
    st.innerHTML = `
      <div class="list">${JOBS.map(j=>`
        <div class="row ${j.cls} ${S.job===j.id?'open':''}">
          <button data-job="${j.id}" aria-expanded="${S.job===j.id}">
            <span class="ico">${j.icon}</span>
            <span class="b"><span class="jt">${j.title}</span><span class="jd">${j.desc}</span>
              <span class="finds"><span class="l">${j.look}</span>${j.chips.map(c=>`<span class="chip">${c}</span>`).join('')}</span></span>
            <span class="go"><span>${S.job===j.id?'Hide':'Get the prompt'}</span>${I.arrow}</span>
          </button>
          ${S.job===j.id?panelHTML(j):''}
        </div>`).join('')}
      </div>
      ${FOOT}`;
  }
  $('#v-a').setAttribute('aria-pressed',S.variant==='a');
  $('#v-b').setAttribute('aria-pressed',S.variant==='b');
}

async function copy(text){
  try{ await navigator.clipboard.writeText(text); }catch(e){
    const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select();
    try{document.execCommand('copy')}catch(_){} t.remove();
  }
}

document.addEventListener('click',(e)=>{
  const jb = e.target.closest('[data-job]');
  if(jb){
    const id = jb.dataset.job;
    const same = S.job===id;
    S.job = same ? null : id;
    S.copied=false; S.stage=0; S.open=false;
    render();
    return;
  }
  const a = e.target.closest('[data-act]');
  if(a){
    const j = jobById(S.job);
    if(a.dataset.act==='toggle'){ S.open=!S.open; render(); }
    if(a.dataset.act==='copy'){ copy(j.prompt(true)); S.copied=true; render(); }
    if(a.dataset.act==='copy-nokeys'){ copy(j.prompt(false)); S.copied=true; render(); }
  }
});
$('#v-a').onclick=()=>{S.variant='a';render()};
$('#v-b').onclick=()=>{S.variant='b';render()};
$('#demo').onclick=()=>{
  if(!S.job){ S.job='kill'; }
  else if(!S.copied){ S.copied=true; S.stage=0; }
  else if(S.stage<2){ S.stage++; }
  else { S.copied=false; S.stage=0; S.job=null; S.open=false; }
  render();
  const p=document.querySelector('.payoff,.watch'); if(p) p.scrollIntoView({block:'nearest',behavior:'smooth'});
};
$('#m-ai').onclick=()=>{ $('#ai').hidden=false; $('#manual').hidden=true; $('#m-ai').setAttribute('aria-pressed',true); $('#m-manual').setAttribute('aria-pressed',false); };
$('#m-manual').onclick=()=>{ $('#ai').hidden=true; $('#manual').hidden=false; $('#m-ai').setAttribute('aria-pressed',false); $('#m-manual').setAttribute('aria-pressed',true); };

$('#notes').innerHTML = `
  <h2>Why this design</h2>
  <h4>The idea</h4>
  <ul>
    <li><b>Offer an outcome, not a setup task.</b> Each card is something an engineer wants even if they have never used feature flags. Install is how it happens.</li>
    <li><b>The agent finds the target.</b> Every job starts with a read-only scan and a short report about their code.</li>
    <li><b>Pick, then prompt.</b> No stepper. Progress appears only after they copy.</li>
  </ul>
  <h4>Trust</h4>
  <ul>
    <li><b>It is a prompt.</b> No MCP server, API token, or download. Keys are added at copy time.</li>
    <li><b>The agent owns the work.</b> The scan runs in their agent. LaunchDarkly cannot see the repo.</li>
    <li><b>One step in LaunchDarkly.</b> The agent hands back a prefilled create link.</li>
  </ul>
  <h4>Why these four</h4>
  <ul>
    <li><b>Three real jobs and the quick start.</b> Safety, speed, and consolidation, plus "just show me it works". The pick tells us which one brought them here.</li>
    <li><b>High hit rate.</b> Almost every app has outside calls, work in progress, and scattered toggles.</li>
    <li><b>Held back for later.</b> "Change a production setting without a deploy" tested well, but it needs a number or string flag that the create link cannot prefill yet. It is the natural next suggestion after a first job.</li>
  </ul>
  <h4>A vs B</h4>
  <ul>
    <li><b>A · Cards</b> sells each offer with what it looks for. After a pick the cards shrink to a row so the prompt sits right under them.</li>
    <li><b>B · List</b> is the lower-copy version. The prompt opens inside the row you chose.</li>
    <li>Randomize order per account and log position with the pick.</li>
  </ul>
  <h4>About this page</h4>
  <ul><li>Static prototype with made-up data and example keys. Copy prompt really copies. "Demo: next state" steps through what happens after the copy.</li></ul>`;
$('#why').onclick=()=>{ const n=$('#notes'); n.classList.toggle('on'); $('#why').setAttribute('aria-pressed',n.classList.contains('on')); };

const q = new URLSearchParams(location.search);
if(q.get('v')==='b') S.variant='b';
if(q.get('job') && jobById(q.get('job'))) S.job=q.get('job');
if(q.get('stage')){ S.copied=true; S.stage=Math.min(2,+q.get('stage')||0); if(!S.job) S.job='kill'; }
render();
</script>
</body>
</html>
